name: Push Options Test
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check push options in event JSON
        run: |
          python3 << 'PYEOF'
          import json, os
          with open(os.environ['GITHUB_EVENT_PATH']) as f:
              e = json.load(f)
          print('TOP_LEVEL_KEYS:', sorted(e.keys()))
          for k in sorted(e.keys()):
              if any(x in k.lower() for x in ['push','hook','option','stat']):
                  print('MATCH:', repr(k), '=', repr(e[k]))
          print('push_options present:', 'push_options' in e)
          PYEOF
      - name: Safe env var test
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message via env: $COMMIT_MSG"
          echo "Done"
