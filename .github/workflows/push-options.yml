name: Push Options Test
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Dump full event JSON
        run: |
          echo "=== GITHUB_EVENT_NAME ==="
          echo "$GITHUB_EVENT_NAME"
          echo "=== Event JSON (push options present?) ==="
          cat "$GITHUB_EVENT_PATH"
          echo ""
          echo "=== Environment variables ==="
          env | grep -i "push\|option\|ref\|head" || true
