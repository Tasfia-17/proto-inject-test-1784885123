name: Network Recon
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Internal network recon
        run: |
          echo "=== Runner identity ==="
          id
          hostname
          cat /etc/hostname
          ip addr show | grep "inet " | awk '{print $2}'
          
          echo "=== Internal DNS ==="
          cat /etc/resolv.conf
          cat /etc/hosts
          
          echo "=== Metadata service ==="
          curl -s --max-time 3 http://169.254.169.254/latest/meta-data/ 2>&1 | head -20
          curl -s --max-time 3 http://169.254.169.254/metadata/instance?api-version=2021-02-01 -H "Metadata: true" 2>&1 | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d, indent=2))" 2>&1 | head -60
          
          echo "=== ACTIONS tokens ==="
          echo "ACTIONS_RUNTIME_URL=$ACTIONS_RUNTIME_URL"
          echo "ACTIONS_RESULTS_URL=$ACTIONS_RESULTS_URL"
          echo "ACTIONS_CACHE_URL=$ACTIONS_CACHE_URL"
          echo "GITHUB_API_URL=$GITHUB_API_URL"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "AGENT_TOOLSDIRECTORY=$AGENT_TOOLSDIRECTORY"
          
          echo "=== Network routes ==="
          ip route
          
          echo "=== Internal port scan (key ranges) ==="
          for host in 10.0.0.1 172.16.0.1 192.168.0.1 100.100.100.200; do
            ping -c1 -W1 $host 2>/dev/null && echo "REACHABLE: $host" || true
          done
