name: Push Options Test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: TEST1 push event keys
        run: cat "$GITHUB_EVENT_PATH" | python3 -c "import json,sys; e=json.load(sys.stdin); print('KEYS:', sorted(e.keys())); print('push_options:', 'push_options' in e); print('author:', e.get('head_commit',{}).get('author',{}).get('name'))"

      - name: TEST2 author name via env
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "AUTHOR_NAME_VALUE=$AUTHOR_NAME"
          echo "COMMIT_MSG_VALUE=$COMMIT_MSG"
          ls /tmp/pwned_author 2>/dev/null && echo "PWNED_FILE_EXISTS" || echo "NO_INJECTION"

      - name: TEST3 token length
        run: |
          echo "GITHUB_TOKEN_LEN=${#GITHUB_TOKEN}"
          echo "ACTIONS_RUNTIME_TOKEN_LEN=${#ACTIONS_RUNTIME_TOKEN}"
